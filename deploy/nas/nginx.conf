server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "DENY" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;

  # Solo se sirven archivos estáticos: nada de listados de carpetas ni métodos de escritura.
  autoindex off;
  if ($request_method !~ ^(GET|HEAD)$) { return 405; }

  # El service worker y el manifiesto no se guardan en caché: así las actualizaciones llegan solas.
  location = /panel/sw.js { add_header Cache-Control "no-cache" always; add_header X-Content-Type-Options "nosniff" always; }
  location = /panel/manifest.webmanifest { default_type application/manifest+json; add_header Cache-Control "no-cache" always; }

  location / { try_files $uri $uri/ =404; }
}
