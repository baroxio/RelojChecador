# Sirve el panel (docs/) desde el NAS. Solo archivos estáticos, montados de solo lectura.
# Uso (en la carpeta deploy/nas):  docker compose up -d
# Se abre en http://IP-DEL-NAS:8095/panel/
# Acceso desde fuera: el túnel que ya existe en el NAS (moba-tunnel) publica checador.moba.mx -> http://192.168.68.117:8095
# (regla en /volume1/Docker/cloudflared/config.yml, ver docs/despliegue-nas.md).
services:
  panel:
    image: nginx:1.27-alpine
    container_name: relojchecador-panel
    restart: unless-stopped
    ports:
      - "8095:80"
    volumes:
      - ../../docs:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
