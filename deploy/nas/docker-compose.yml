# Sirve el panel (docs/) desde el NAS. Solo archivos estáticos, montados de solo lectura.
# Uso (en la carpeta deploy/nas):  docker compose up -d
# Se abre en http://IP-DEL-NAS:8088/panel/  (para fuera de casa, ver docs/despliegue-nas.md)
services:
  panel:
    image: nginx:1.27-alpine
    container_name: relojchecador-panel
    restart: unless-stopped
    ports:
      - "8088:80"
    volumes:
      - ../../docs:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
