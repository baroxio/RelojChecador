# Prueba y despliega las Edge Functions de Supabase.
# Se ejecuta al subir cambios de supabase/functions a main, o a mano desde la pestaña Actions.
# Requiere el secreto de GitHub SUPABASE_ACCESS_TOKEN (ver docs/webhook-whatsapp.md).

name: Desplegar funciones

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - ".github/workflows/desplegar-funciones.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desplegar-funciones
  cancel-in-progress: false

env:
  # El identificador del proyecto no es secreto: aparece en la URL pública de la API.
  SUPABASE_PROJECT_REF: bclmvyifdxalnfxzjmyj

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Pruebas de la lógica compartida
        run: node --test supabase/functions/_shared/logic.test.ts supabase/functions/_shared/invitacion.test.ts

  desplegar:
    needs: probar
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Comprobar que existe el token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Falta el secreto SUPABASE_ACCESS_TOKEN en Settings > Secrets and variables > Actions" >&2
            exit 1
          fi
      # Meta no envía un JWT de Supabase: el webhook se protege con la firma X-Hub-Signature-256.
      - name: Desplegar whatsapp-webhook
        run: supabase functions deploy whatsapp-webhook --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
      # El panel llama a esta función con la sesión del usuario: la verificación de JWT queda activa.
      - name: Desplegar crear-invitacion
        run: supabase functions deploy crear-invitacion --project-ref "$SUPABASE_PROJECT_REF"
